name: Daily pipeline

# Crawl every active source, process what they found, rebuild the next four
# weeks of posts, and re-render them — every morning at 8:00 America/New_York.
#
# Sources are crawled through the shared ingestion service, which resolves
# each source's adapter from `sources.adapter_type`. Adding a university, or
# a new source for an existing one, changes rows in the database — not this
# file. The only Python left here is Owl Central's legacy scraper, kept as a
# manual fallback and no longer part of the automated path.
#
# GitHub's cron only speaks UTC, and 8am Eastern is 12:00 UTC in summer but
# 13:00 UTC in winter. Rather than let the run drift an hour twice a year,
# both times fire and the first step bails out of the one that isn't
# actually 08:00 locally.
on:
  schedule:
    - cron: "0 12 * * *" # 08:00 EDT (Mar–Nov)
    - cron: "0 13 * * *" # 08:00 EST (Nov–Mar)
  workflow_dispatch:
    inputs:
      school:
        description: "School short name"
        required: false
        default: "FAU"

concurrency:
  # Two runs writing posts for the same week would race each other; a manual
  # run while the nightly one is mid-flight is the likely way that happens.
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCHOOL: ${{ github.event.inputs.school || 'FAU' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'mock' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}

    steps:
      - name: Skip if this isn't 08:00 in New York
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "08" ]; then
            echo "Local time is ${hour}:00 in New York — this is the daylight-saving twin. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile

      - name: Build workspace
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter "@college-events/worker..." build

      # ── 1. Crawl every source that is due ───────────────────────
      # The scheduler enqueues one job per due source and works the queue
      # with bounded concurrency, so a slow or hostile platform holds up
      # only its own job. This step is a convenience for a single school;
      # nothing about the model requires the crawl to happen here, which
      # is the point — it is what lets this stop being one nightly script
      # once there are more universities than fit in one run.
      - name: Crawl sources
        if: steps.gate.outputs.run == 'true'
        id: crawl
        run: pnpm worker crawl "$SCHOOL"

      # ── 2. Turn raw content into scored, categorized events ──────────
      - name: Process raw content
        if: steps.gate.outputs.run == 'true'
        run: pnpm worker process "$SCHOOL"

      # ── 2b. Resolve every event's artwork ─────────────────────────────
      # Picks the best real image across every linked source, or generates
      # one when none exists. Separated from processing because generation
      # can call a paid model — putting it on the ingestion hot path would
      # make one slow image call as costly as reprocessing everything.
      - name: Resolve artwork
        if: steps.gate.outputs.run == 'true'
        run: pnpm worker resolve-artwork "$SCHOOL"

      # ── 3. Rebuild this week + the next three ────────────────────────
      - name: Select posts
        if: steps.gate.outputs.run == 'true'
        run: pnpm worker select-posts "$SCHOOL"

      # ── 4. Re-render so previews match the rebuilt event lists ───────
      - name: Render posts
        if: steps.gate.outputs.run == 'true'
        run: pnpm worker render-all "$SCHOOL"

      # A source can answer 200 and still return nothing, which looks like a
      # clean run while coverage quietly shrinks. The report reads health
      # straight from the source registry, so a degraded or silent source is
      # visible here rather than only in the database.
      - name: Summary
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          {
            echo "### Daily pipeline — $SCHOOL"
            echo ""
            pnpm --silent worker source-report "$SCHOOL" || echo "_source report unavailable_"
          } >> "$GITHUB_STEP_SUMMARY"
