name: Daily pipeline

# Scrape all three sources, process what they found, rebuild the next four
# weeks of posts, and re-render them — every morning at 8:00 America/New_York.
#
# GitHub's cron only speaks UTC, and 8am Eastern is 12:00 UTC in summer but
# 13:00 UTC in winter. Rather than let the run drift an hour twice a year,
# both times fire and the first step bails out of the one that isn't
# actually 08:00 locally.
on:
  schedule:
    - cron: "0 12 * * *" # 08:00 EDT (Mar–Nov)
    - cron: "0 13 * * *" # 08:00 EST (Nov–Mar)
  workflow_dispatch:
    inputs:
      school:
        description: "School short name"
        required: false
        default: "FAU"

concurrency:
  # Two runs writing posts for the same week would race each other; a manual
  # run while the nightly one is mid-flight is the likely way that happens.
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCHOOL: ${{ github.event.inputs.school || 'FAU' }}
      SCRAPE_DIR: ${{ github.workspace }}/.scrape-output
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'mock' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}

    steps:
      - name: Skip if this isn't 08:00 in New York
        id: gate
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "08" ]; then
            echo "Local time is ${hour}:00 in New York — this is the daylight-saving twin. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pnpm install --frozen-lockfile
          pip install -r scrapers/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build workspace
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter "@college-events/worker..." build

      # ── 1. Scrape ────────────────────────────────────────────────────
      # Each scraper is allowed to fail without taking the run down with
      # it: one site changing its markup should still leave the other two
      # sources flowing into today's posts rather than skipping the day.
      # Failures are surfaced in the summary step at the end.
      - name: Scrape Owl Central
        if: steps.gate.outputs.run == 'true'
        id: owlcentral
        continue-on-error: true
        run: python scrapers/scrape_owlcentral.py --out-dir "$SCRAPE_DIR" --school "$SCHOOL"

      - name: Scrape Posh.vip
        if: steps.gate.outputs.run == 'true'
        id: posh
        continue-on-error: true
        run: python scrapers/scrape_posh.py --out-dir "$SCRAPE_DIR"

      # ── 2. Import what the scrapers produced ─────────────────────────
      # Guarded on the file existing so a failed scrape above doesn't turn
      # into a confusing "file not found" here.
      # A 0-card scrape still exits 0 (it's a legitimate "nothing new today"
      # outcome, not always a bug), so the pass/fail step outcome alone can't
      # be trusted -- upload whatever debug evidence the scraper captured
      # (screenshot + raw HTML of any page where it found zero cards) so a
      # bot-detection wall or a real markup change can be told apart without
      # reproducing it by hand.
      - name: Upload Posh.vip debug capture
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: posh-debug-capture
          path: ${{ env.SCRAPE_DIR }}/debug/
          if-no-files-found: ignore
          retention-days: 5

      - name: Import Owl Central CSV
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          school_lower=$(echo "$SCHOOL" | tr '[:upper:]' '[:lower:]')
          f="$SCRAPE_DIR/college_events_import_${school_lower}_owlcentral.csv"
          if [ -f "$f" ]; then
            pnpm worker import-csv "$SCHOOL" "$f" owlcentral-scraper --source="Owl Central (CSV Import)"
          else
            echo "No Owl Central CSV produced — skipping import."
          fi

      - name: Import Posh.vip CSV
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          f="$SCRAPE_DIR/college_events_import_$(echo "$SCHOOL" | tr '[:upper:]' '[:lower:]').csv"
          if [ -f "$f" ]; then
            pnpm worker import-csv "$SCHOOL" "$f" posh-scraper --source="Posh.vip Nightlife"
          else
            echo "No Posh.vip CSV produced — skipping import."
          fi

      # ── 3. The third source needs no scraper: it has a native adapter ─
      - name: Ingest adapter-backed sources (FAU Athletics)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: pnpm worker ingest "$SCHOOL"

      # ── 4. Turn raw content into scored, categorized events ──────────
      - name: Process raw content
        if: steps.gate.outputs.run == 'true'
        run: pnpm worker process "$SCHOOL"

      # ── 5. Rebuild this week + the next three ────────────────────────
      - name: Select posts
        if: steps.gate.outputs.run == 'true'
        run: pnpm worker select-posts "$SCHOOL"

      # ── 6. Re-render so previews match the rebuilt event lists ───────
      - name: Render posts
        if: steps.gate.outputs.run == 'true'
        run: pnpm worker render-all "$SCHOOL"

      - name: Summary
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          # A scraper step can exit 0 while still having found nothing --
          # count the rows it actually produced instead of trusting the step
          # outcome, so a silent zero-event morning doesn't read as a clean
          # "success" here the way it does in the raw step list above.
          count_rows() {
            f="$1"
            if [ -f "$f" ]; then
              n=$(($(wc -l < "$f") - 1))
              [ "$n" -lt 0 ] && n=0
              echo "$n"
            else
              echo 0
            fi
          }
          school_lower=$(echo "$SCHOOL" | tr '[:upper:]' '[:lower:]')
          owl_count=$(count_rows "$SCRAPE_DIR/college_events_import_${school_lower}_owlcentral.csv")
          posh_count=$(count_rows "$SCRAPE_DIR/college_events_import_$school_lower.csv")

          {
            echo "### Daily pipeline — $SCHOOL"
            echo ""
            echo "| Scraper | Step outcome | Events found |"
            echo "|---|---|---|"
            echo "| Owl Central | ${{ steps.owlcentral.outcome }} | $owl_count |"
            echo "| Posh.vip | ${{ steps.posh.outcome }} | $posh_count |"
            echo ""
            if [ -f "$SCRAPE_DIR/posh-blocked.txt" ]; then
              echo "🚫 **Posh.vip was blocked by Cloudflare** — $(cat "$SCRAPE_DIR/posh-blocked.txt")"
              echo ""
              echo "posh.vip runs bot management in front of \`/explore\` and challenges headless browsers regardless of network (confirmed from CI and from a residential connection). This is the site's access control, not a bug — nightlife events need a manual \`--headed\` import (see \`scrapers/README.md\`) or feed access from posh.vip."
            elif [ "$posh_count" -eq 0 ]; then
              echo "⚠️ Posh.vip found 0 events without being challenged — the page layout may have changed. Check the \`posh-debug-capture\` artifact for a screenshot/HTML of what the scraper saw."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
